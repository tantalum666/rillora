# Generates RilloraHealthNext.xcodeproj beside the untouched current project.
name: RilloraHealthNext
include:
  - project.yml
packages:
  RilloraHeartRateKit:
    path: NextVersionHealth
targets:
  Rillora:
    dependencies:
      - package: RilloraHeartRateKit
    sources:REPLACE:
      - path: ../../config/provider-guides.json
        buildPhase: resources
      - path: ../../config/disclosure-copy.json
        buildPhase: resources
      - path: Rillora
        excludes:
          - Resources/Info.plist
      - path: StoreKit/Rillora.storekit
        buildPhase: resources
      - path: NextVersionHealth/Configuration
        excludes:
          - Info.plist
          - RilloraNext.entitlements
        buildPhase: resources
    info:
      path: NextVersionHealth/Configuration/Info.plist
      properties:
        NSHealthShareUsageDescription: "Rillora reads the heart, activity, sleep and workout records you select so you can review them on this device. Records are not uploaded or used to unlock your plan."
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RILLORA_HEALTHKIT_NEXT_VERSION"
        CODE_SIGN_ENTITLEMENTS: NextVersionHealth/Configuration/RilloraNext.entitlements
