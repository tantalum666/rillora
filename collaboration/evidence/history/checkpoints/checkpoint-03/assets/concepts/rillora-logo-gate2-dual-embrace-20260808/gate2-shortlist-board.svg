<svg width="1380" height="780" viewBox="0 0 1380 780" xmlns="http://www.w3.org/2000/svg"><rect width="1380" height="780" fill="#F5F2EA"/><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#5F5D57">RILLORA / LOGO GATE 2 / INTERNAL SHORTLIST</text><text x="54" y="94" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#11110F">Dual Embrace — three surviving seam studies</text><text x="54" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5F5D57">Twelve controlled vectors → five mechanical passes → three semantic survivors. C2 is the design recommendation.</text><g id="shortlist-A4"><rect x="54" y="166" width="408" height="548" rx="18" fill="#FFFFFF" stroke="#D6D3CB"/><text x="80" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35" fill="#5F5D57">A4 / CLOSEST TO GATE 1</text><text x="80" y="236" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#11110F">Deep</text><g transform="translate(138 257) scale(0.75)"><defs><clipPath id="shortlist-main-A4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 182.52 76 213.28 117 177.08 160 C 125.02 203 138.24 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-main-A4-clip)"/></g><g transform="translate(88 536) scale(0.1)"><defs><clipPath id="shortlist-mini-A4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 182.52 76 213.28 117 177.08 160 C 125.02 203 138.24 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-mini-A4-clip)"/></g><rect x="154" y="522" width="54" height="54" rx="8" fill="#11110F"/><g transform="translate(165 533) scale(0.1)"><defs><clipPath id="shortlist-reverse-A4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#FFFFFF"/><path d="M 58 61 C 182.52 76 213.28 117 177.08 160 C 125.02 203 138.24 244 262 259" fill="none" stroke="#11110F" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-reverse-A4-clip)"/></g><text x="232" y="554" font-family="Inter, Arial, sans-serif" font-size="12" fill="#77746D">32px / reverse</text><text x="80" y="624" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5F5D57"><tspan x="80" dy="0">Most faithful to the selected Yin-Yang feeling;</tspan><tspan x="80" dy="21">highest residual taijitu and ball-seam risk.</tspan></text></g><g id="shortlist-C2"><rect x="486" y="166" width="408" height="548" rx="18" fill="#FFFFFF" stroke="#D6D3CB"/><text x="512" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35" fill="#5F5D57">C2 / DESIGN RECOMMENDATION</text><text x="512" y="236" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#11110F">Weighted</text><g transform="translate(570 257) scale(0.75)"><defs><clipPath id="shortlist-main-C2-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 203.64 76 220.96 117 181.56 160 C 122.14 203 135.68 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-main-C2-clip)"/></g><g transform="translate(520 536) scale(0.1)"><defs><clipPath id="shortlist-mini-C2-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 203.64 76 220.96 117 181.56 160 C 122.14 203 135.68 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-mini-C2-clip)"/></g><rect x="586" y="522" width="54" height="54" rx="8" fill="#11110F"/><g transform="translate(597 533) scale(0.1)"><defs><clipPath id="shortlist-reverse-C2-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#FFFFFF"/><path d="M 58 61 C 203.64 76 220.96 117 181.56 160 C 122.14 203 135.68 244 262 259" fill="none" stroke="#11110F" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-reverse-C2-clip)"/></g><text x="664" y="554" font-family="Inter, Arial, sans-serif" font-size="12" fill="#77746D">32px / reverse</text><text x="512" y="624" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5F5D57"><tspan x="512" dy="0">Best balance of mutuality and calm tension;</tspan><tspan x="512" dy="21">clearly departs from an equal taijitu split.</tspan></text></g><g id="shortlist-C4"><rect x="918" y="166" width="408" height="548" rx="18" fill="#FFFFFF" stroke="#D6D3CB"/><text x="944" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35" fill="#5F5D57">C4 / DISTINCTIVENESS BOUNDARY</text><text x="944" y="236" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#11110F">Maximum</text><g transform="translate(1002 257) scale(0.75)"><defs><clipPath id="shortlist-main-C4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 224.76 76 228.64 117 186.04 160 C 119.26 203 133.12 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-main-C4-clip)"/></g><g transform="translate(952 536) scale(0.1)"><defs><clipPath id="shortlist-mini-C4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#11110F"/><path d="M 58 61 C 224.76 76 228.64 117 186.04 160 C 119.26 203 133.12 244 262 259" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-mini-C4-clip)"/></g><rect x="1018" y="522" width="54" height="54" rx="8" fill="#11110F"/><g transform="translate(1029 533) scale(0.1)"><defs><clipPath id="shortlist-reverse-C4-clip"><circle cx="160" cy="160" r="120"/></clipPath></defs><circle cx="160" cy="160" r="120" fill="#FFFFFF"/><path d="M 58 61 C 224.76 76 228.64 117 186.04 160 C 119.26 203 133.12 244 262 259" fill="none" stroke="#11110F" stroke-width="16" stroke-linecap="round" clip-path="url(#shortlist-reverse-C4-clip)"/></g><text x="1096" y="554" font-family="Inter, Arial, sans-serif" font-size="12" fill="#77746D">32px / reverse</text><text x="944" y="624" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5F5D57"><tspan x="944" dy="0">Strongest asymmetry and independent recall;</tspan><tspan x="944" dy="21">may weaken gentle two-sided interdependence.</tspan></text></g><text x="54" y="752" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5F5D57">Owner selection is required before manual vector reconstruction. These remain variation evidence, not final Logo candidates.</text></svg>