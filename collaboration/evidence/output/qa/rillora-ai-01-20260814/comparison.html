<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rillora AI-01 source comparison</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 36px; background: #0d1111; color: #f1ece2; }
      h1 { margin: 0 0 8px; font: 600 22px/1.2 Georgia, serif; }
      p { margin: 0 0 28px; color: #aeb3ad; font-size: 13px; }
      .comparison { display: grid; grid-template-columns: repeat(2, 390px); gap: 28px; align-items: start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; color: #9bb180; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 390px; height: 844px; object-fit: fill; border: 1px solid rgba(212, 216, 201, .22); background: #171c1c; }
    </style>
  </head>
  <body>
    <h1>AI-01 mobile source-to-Web comparison</h1>
    <p>Normalized to the same 390 × 844 viewport. The source defines visual character; the implementation preserves real navigation, copy truth and responsive controls.</p>
    <section class="comparison">
      <figure>
        <figcaption>Selected source · AI-01</figcaption>
        <img src="../../../assets/concepts/rillora-ui-directions-20260814/AI-01-architectural-index.png" alt="Selected AI-01 concept" />
      </figure>
      <figure>
        <figcaption>Responsive Web implementation</figcaption>
        <img src="web-mobile-390x844-hero-final.jpg" alt="Web implementation at 390 by 844" />
      </figure>
    </section>
  </body>
</html>
