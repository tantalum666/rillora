      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      SuppressionOptions:
        SuppressedReasons:
          - BOUNCE
          - COMPLAINT
        ValidationOptions:
          ConditionThreshold:
            ConditionThresholdEnabled: DISABLED
      Tags:
        - Key: Environment
          Value: Production
        - Key: Project
          Value: Rillora
      VdmOptions:
        DashboardOptions:
